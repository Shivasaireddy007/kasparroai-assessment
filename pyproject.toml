[project]
name = "claimcheck"
version = "0.1.0"
description = "Extract and classify factual claims in long AI answers against a speaker catalogue"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
